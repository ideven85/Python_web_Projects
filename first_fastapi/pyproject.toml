[project]
name = "first-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "psycopg-binary>=3.3.9",
    "psycopg[binary]>=3.3.9",
    "sqlmodel>=0.0.49",
    "uvicorn>=0.54.0",
]

[project.scripts]
first-fastapi = "first_fastapi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
